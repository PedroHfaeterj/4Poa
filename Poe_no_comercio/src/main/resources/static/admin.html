<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel Admin - Põe no Comércio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="menu-navegacao"></header>
    
    <div class="container">
        <h1>Área do Administrador - Gestão de Estoque</h1>

        <div class="card">
            <h2>Cadastrar Novo Produto</h2>
            <input type="text" id="nome" placeholder="Nome do Produto">
            <input type="number" id="preco" placeholder="Preço (ex: 150.00)" step="0.01">
            <input type="text" id="descricao" placeholder="Descrição">
            <button onclick="salvarProduto()">Cadastrar Produto</button>
        </div>

        <div class="card">
            <h2>Produtos Cadastrados</h2>
            <ul id="lista-produtos"></ul>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        const usuario = JSON.parse(localStorage.getItem("usuarioLogado"));
        if (!usuario || usuario.email !== "admin@loja.com") {
            alert("Acesso restrito. Apenas administradores podem acessar esta página.");
            window.location.href = "login.html";
        }
    </script>
    <script src="navbar.js"></script>
</body>
</html>
