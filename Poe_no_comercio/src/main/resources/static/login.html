<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login - Põe no Comércio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="menu-navegacao"></header>
    
    <div class="container">
        <div class="card" style="max-width: 400px; margin: 50px auto; text-align: center;">
            <h2>Acessar o Sistema</h2>
            <input type="email" id="emailLogin" placeholder="E-mail corporativo ou pessoal">
            <input type="password" id="senhaLogin" placeholder="Senha">
            <button onclick="fazerLogin()" style="width: 100%; margin-top: 10px;">Entrar</button>
            <p style="margin-top: 15px;"><a href="cadastro.html">Não tem conta? Cadastre-se</a></p>
        </div>
    </div>

    <script src="auth.js"></script>
    <script src="navbar.js"></script>
</body>
</html>
