<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Meu Carrinho - Põe no Comércio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="menu-navegacao"></header>
    
    <div class="container">
        <h1>Meu Carrinho</h1>
        <div class="card">
            <ul id="lista-carrinho"></ul>
            <h2 id="total-carrinho" style="text-align: right; margin-top: 20px;">Total: R$ 0.00</h2>
            <button onclick="finalizarCompra()" style="width: 100%; background-color: #28a745; font-size: 1.1em; padding: 15px;">Finalizar Pedido</button>
        </div>
    </div>

    <script>
        const usuario = JSON.parse(localStorage.getItem("usuarioLogado"));
        if (!usuario || usuario.email === "admin@loja.com") {
            window.location.href = "login.html";
        }
    </script>
    <script src="carrinho.js"></script>
    <script src="navbar.js"></script>
</body>
</html>
