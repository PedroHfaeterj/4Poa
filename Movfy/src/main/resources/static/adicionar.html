<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Movfy - Buscar Filme</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Estilos garantidos para o Modal de Estrelas */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(4px);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.ativo {
            display: flex !important;
        }
        .modal-box {
            background: #222;
            border: 1px solid #444;
            border-radius: 12px;
            padding: 28px;
            width: 90%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.9);
        }
        .modal-box h2 { font-size: 1.3em; margin-bottom: 6px; color: #fff; }
        .modal-subtitulo { color: #f39c12; font-weight: bold; margin-bottom: 18px; font-size: 1.05em; }
        .estrelas-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 15px 0 20px 0;
        }
        .estrela-btn {
            font-size: 38px;
            cursor: pointer;
            color: #444;
            transition: transform 0.15s, color 0.2s;
            user-select: none;
        }
        .estrela-btn:hover { transform: scale(1.2); }
        .estrela-btn.ativa {
            color: #f39c12;
            text-shadow: 0 0 12px rgba(243, 156, 18, 0.5);
        }
        .modal-textarea {
            width: 100%;
            height: 85px;
            background: #181818;
            border: 1px solid #444;
            border-radius: 8px;
            color: #fff;
            padding: 12px;
            font-family: inherit;
            font-size: 14px;
            resize: none;
            margin-bottom: 20px;
        }
        .modal-acoes { display: flex; gap: 12px; }
        .modal-acoes button { flex: 1; padding: 11px; }
        .btn-cancelar { background: #444; }
        .btn-cancelar:hover { background: #5a5a5a; }
        .toast-msg {
            position: fixed;
            bottom: 25px; right: 25px;
            background: #27ae60;
            color: white;
            padding: 14px 24px;
            border-radius: 8px;
            font-weight: bold;
            box-shadow: 0 6px 20px rgba(0,0,0,0.6);
            z-index: 10000;
            display: none;
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">Meu Diário</a> | 
        <a href="adicionar.html">Adicionar Filme</a> | 
        <a href="roleta.html">Roleta do Oscar</a>
    </nav>

    <h1>Encontrar Filme</h1>
    <p style="margin-bottom: 20px;">Pesquise pelo nome e clique no filme para avaliar.</p>

    <div class="form-container">
        <input type="text" id="nomeFilme" placeholder="Ex: Matrix, O Senhor dos Anéis..." onkeypress="if(event.key === 'Enter') pesquisar()">
        <button type="button" onclick="pesquisar()">Pesquisar no TMDB</button>
    </div>

    <div id="resultados-busca" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; margin-top: 30px;"></div>

    <!-- Modal Customizado de Avaliação -->
    <div class="modal-overlay" id="modalAvaliacao">
        <div class="modal-box">
            <h2>Avaliar Filme</h2>
            <p class="modal-subtitulo" id="modalTituloFilme"></p>
            
            <div class="estrelas-container" id="estrelasContainer">
                <span class="estrela-btn" onclick="selecionarEstrela(1)">★</span>
                <span class="estrela-btn" onclick="selecionarEstrela(2)">★</span>
                <span class="estrela-btn" onclick="selecionarEstrela(3)">★</span>
                <span class="estrela-btn" onclick="selecionarEstrela(4)">★</span>
                <span class="estrela-btn" onclick="selecionarEstrela(5)">★</span>
            </div>

            <textarea id="modalComentario" class="modal-textarea" placeholder="O que você achou do filme? (Opcional)..."></textarea>

            <div class="modal-acoes">
                <button type="button" class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
                <button type="button" onclick="confirmarSalvamento()">Salvar no Diário</button>
            </div>
        </div>
    </div>

    <div class="toast-msg" id="toastMsg">✅ Filme salvo com sucesso!</div>

    <script>
        let filmesEncontrados = [];
        let filmeSelecionado = null;
        let notaSelecionada = 5;

        function selecionarEstrela(valor) {
            notaSelecionada = valor;
            const estrelas = document.querySelectorAll('#estrelasContainer .estrela-btn');
            estrelas.forEach((estrela, index) => {
                if (index < valor) {
                    estrela.classList.add('ativa');
                } else {
                    estrela.classList.remove('ativa');
                }
            });
        }

        async function pesquisar() {
            const nome = document.getElementById('nomeFilme').value.trim();
            if (!nome) return;
            const container = document.getElementById('resultados-busca');
            container.innerHTML = '<p>Buscando...</p>';

            try {
                const response = await fetch(`http://localhost:8080/api/diario/buscar?nome=${encodeURIComponent(nome)}`);
                filmesEncontrados = await response.json();
                container.innerHTML = '';

                if (!filmesEncontrados || filmesEncontrados.length === 0) {
                    container.innerHTML = '<p>Nenhum filme encontrado.</p>';
                    return;
                }

                filmesEncontrados.forEach((filme, index) => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.style.cursor = 'pointer';
                    card.onclick = () => abrirModalAvaliacao(index);

                    card.innerHTML = `
                        <img src="${filme.urlCapa}" alt="${filme.titulo}">
                        <h3>${filme.titulo}</h3>
                        <button type="button" style="width: 100%; margin-top: 10px;">⭐ Avaliar e Salvar</button>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                container.innerHTML = '<p style="color:#e50914;">Erro de conexão com o servidor Java.</p>';
            }
        }

        function abrirModalAvaliacao(index) {
            filmeSelecionado = filmesEncontrados[index];
            if (!filmeSelecionado) return;

            document.getElementById('modalTituloFilme').innerText = filmeSelecionado.titulo;
            document.getElementById('modalComentario').value = '';
            selecionarEstrela(5);
            document.getElementById('modalAvaliacao').classList.add('ativo');
        }

        function fecharModal() {
            document.getElementById('modalAvaliacao').classList.remove('ativo');
            filmeSelecionado = null;
        }

        function confirmarSalvamento() {
            if (!filmeSelecionado) return;

            let filmesLocais = [];
            try {
                filmesLocais = JSON.parse(localStorage.getItem('movfy_diario')) || [];
                if (!Array.isArray(filmesLocais)) filmesLocais = [];
            } catch (e) {
                filmesLocais = [];
            }

            const idxExistente = filmesLocais.findIndex(f => Number(f.id) === Number(filmeSelecionado.id));

            const itemParaSalvar = {
                id: filmeSelecionado.id,
                titulo: filmeSelecionado.titulo,
                urlCapa: filmeSelecionado.urlCapa,
                nota: notaSelecionada,
                comentario: document.getElementById('modalComentario').value.trim()
            };

            if (idxExistente >= 0) {
                filmesLocais[idxExistente] = itemParaSalvar;
            } else {
                filmesLocais.push(itemParaSalvar);
            }

            // 1. Salva imediatamente no navegador
            localStorage.setItem('movfy_diario', JSON.stringify(filmesLocais));

            // 2. Envia para o Java em segundo plano (sem travar a tela caso dê erro)
            fetch(`http://localhost:8080/api/diario/${filmeSelecionado.id}/${notaSelecionada}`, { method: 'POST' }).catch(() => {});

            fecharModal();
            const toast = document.getElementById('toastMsg');
            toast.style.display = 'block';
            
            setTimeout(() => {
                window.location.href = "index.html";
            }, 700);
        }
    </script>
</body>
</html>
