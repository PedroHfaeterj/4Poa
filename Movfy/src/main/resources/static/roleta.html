<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Movfy - Roleta do Oscar</title>
    <link rel="stylesheet" href="style.css">
    <style>
        #canvasRoleta {
            transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            border: 4px solid #f39c12;
        }
    </style>
</head>
<body onload="desenharRoleta()">
    <nav>
        <a href="index.html">Meu Diário</a> | 
        <a href="adicionar.html">Adicionar Filme</a> | 
        <a href="roleta.html">Roleta do Oscar</a>
    </nav>

    <h1>Sorteio do Oscar</h1>
    <p style="margin-bottom: 15px;">Gire a roda e descubra qual obra-prima você vai assistir hoje!</p>
    
    <button id="btnGirar" onclick="iniciarSorteio()">GIRAR A ROLETA</button>

    <div class="canvas-container" id="area-roleta">
        <canvas id="canvasRoleta" width="400" height="400"></canvas>
    </div>
    
    <div id="resultado" class="card" style="display:none; margin-top:20px; max-width: 650px; margin-left: auto; margin-right: auto; text-align: left;">
        <div style="display: flex; gap: 20px; align-items: flex-start;">
            <img id="capa" src="" alt="Capa" width="160" style="border-radius: 8px;">
            <div>
                <h2 id="titulo" style="margin-bottom: 8px; color: #ffffff;"></h2>
                <div id="info-oscar" class="badge-oscar"></div>
                <p id="sinopse" style="font-size: 0.95em; color: #ddd; margin-bottom: 20px; line-height: 1.5; text-align: justify;"></p>
                <button onclick="abrirModalRoleta()" style="font-size: 14px; padding: 10px 18px;">⭐ Avaliar e Salvar no Diário</button>
            </div>
        </div>
    </div>

    <!-- Modal Customizado de Avaliação -->
    <div class="modal-overlay" id="modalAvaliacao">
        <div class="modal-box">
            <h2>Avaliar Vencedor do Oscar</h2>
            <p class="modal-subtitulo" id="modalTituloFilme"></p>
            
            <div class="estrelas-container" id="estrelasContainer">
                <span class="estrela-btn" onclick="selecionarEstrela(1)">★</span>
                <span class="estrela-btn" onclick="selecionarEstrela(2)">★</span>
                <span class="estrela-btn" onclick="selecionarEstrela(3)">★</span>
                <span class="estrela-btn" onclick="selecionarEstrela(4)">★</span>
                <span class="estrela-btn" onclick="selecionarEstrela(5)">★</span>
            </div>

            <textarea id="modalComentario" class="modal-textarea" placeholder="O que você achou do filme? (Opcional)..."></textarea>

            <div class="modal-acoes">
                <button class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
                <button onclick="confirmarSalvamentoRoleta()">Salvar no Diário</button>
            </div>
        </div>
    </div>

    <div class="toast-msg" id="toastMsg">Filme salvo no diário!</div>

    <script>
        let filmeVencedor = null;
        let rotacaoAtual = 0;
        let notaSelecionada = 5;
        const fatias = ["Anora", "Oppenheimer", "Parasita", "Gladiador", "Titanic", "Chefão", "Matrix", "Casablanca"];
        const cores = ["#e50914", "#222222", "#e50914", "#222222", "#e50914", "#222222", "#e50914", "#222222"];

        function selecionarEstrela(valor) {
            notaSelecionada = valor;
            const estrelas = document.querySelectorAll('#estrelasContainer .estrela-btn');
            estrelas.forEach((estrela, index) => {
                estrela.classList.toggle('ativa', index < valor);
            });
        }

        function desenharRoleta(nomeVencedor = null) {
            const canvas = document.getElementById("canvasRoleta");
            const ctx = canvas.getContext("2d");
            const numFatias = fatias.length;
            const anguloFatia = (2 * Math.PI) / numFatias;

            if (nomeVencedor) {
                fatias[0] = nomeVencedor.substring(0, 14);
            }

            ctx.clearRect(0, 0, 400, 400);

            for (let i = 0; i < numFatias; i++) {
                const anguloInicio = i * anguloFatia - Math.PI / 2 - anguloFatia / 2;
                const anguloFim = anguloInicio + anguloFatia;

                ctx.beginPath();
                ctx.moveTo(200, 200);
                ctx.arc(200, 200, 200, anguloInicio, anguloFim);
                ctx.fillStyle = cores[i];
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = "#141414";
                ctx.stroke();

                ctx.save();
                ctx.translate(200, 200);
                ctx.rotate(anguloInicio + anguloFatia / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 15px Segoe UI, sans-serif";
                ctx.fillText(fatias[i], 180, 5);
                ctx.restore();
            }
        }

        async function iniciarSorteio() {
            const btn = document.getElementById('btnGirar');
            const canvas = document.getElementById('canvasRoleta');
            
            btn.disabled = true;
            btn.innerText = "SORTEANDO...";
            document.getElementById('resultado').style.display = 'none';
            document.getElementById('area-roleta').style.display = 'block';

            try {
                const resposta = await fetch('http://localhost:8080/api/roleta/oscar');
                filmeVencedor = await resposta.json();

                desenharRoleta(filmeVencedor.titulo);
                rotacaoAtual += 1800;
                canvas.style.transform = `rotate(${rotacaoAtual}deg)`;

                setTimeout(() => {
                    document.getElementById('titulo').innerText = filmeVencedor.titulo;
                    document.getElementById('info-oscar').innerText = filmeVencedor.comentarioIa || "🏆 Vencedor do Oscar de Melhor Filme";
                    document.getElementById('capa').src = filmeVencedor.urlCapa;
                    document.getElementById('sinopse').innerText = filmeVencedor.sinopse || "Sinopse não disponível.";
                    
                    document.getElementById('resultado').style.display = 'block';
                    btn.disabled = false;
                    btn.innerText = "GIRAR NOVAMENTE";
                }, 4100);

            } catch (erro) {
                btn.disabled = false;
                btn.innerText = "GIRAR A ROLETA";
            }
        }

        function abrirModalRoleta() {
            if (!filmeVencedor) return;
            document.getElementById('modalTituloFilme').innerText = filmeVencedor.titulo;
            document.getElementById('modalComentario').value = '';
            selecionarEstrela(5);
            document.getElementById('modalAvaliacao').classList.add('ativo');
        }

        function fecharModal() {
            document.getElementById('modalAvaliacao').classList.remove('ativo');
        }

        async function confirmarSalvamentoRoleta() {
            if (!filmeVencedor) return;

            let locais = JSON.parse(localStorage.getItem('movfy_diario')) || [];
            const indexExistente = locais.findIndex(f => Number(f.id) === Number(filmeVencedor.id));
            
            const novoFilme = {
                id: filmeVencedor.id,
                titulo: filmeVencedor.titulo,
                urlCapa: filmeVencedor.urlCapa,
                nota: notaSelecionada,
                comentario: document.getElementById('modalComentario').value.trim()
            };

            if (indexExistente >= 0) {
                locais[indexExistente] = novoFilme;
            } else {
                locais.push(novoFilme);
            }

            localStorage.setItem('movfy_diario', JSON.stringify(locais));

            try {
                await fetch(`http://localhost:8080/api/diario/${filmeVencedor.id}/${notaSelecionada}`, { method: 'POST' });
            } catch (e) {}

            fecharModal();
            const toast = document.getElementById('toastMsg');
            toast.style.display = 'block';
            setTimeout(() => { window.location.href = "index.html"; }, 900);
        }
    </script>
</body>
</html>
